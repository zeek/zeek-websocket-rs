exclude: bindings/python/zeek_websocket/zeek_websocket.pyi

repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: eeee35a89e69d5772bdee97db1a6a898467b686e  # frozen: v1.0
    hooks:
      - id: fmt
      - id: clippy
        args: ['--all', '--all-features', '--workspace', '--all-targets']
      - id: cargo-check
        args: ['--all', '--all-features', '--workspace', '--all-targets']
  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98  # frozen: v0.19.1
    hooks:
      - id: gitlint
  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
    hooks:
      - id: typos
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f  # frozen: v0.50.0
    hooks:
      - id: markdownlint-fix
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea  # frozen: v4.0.0-alpha.8
    hooks:
      - id: prettier
        exclude: ".*[js|ts]"
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        exclude: .pre-commit-config.yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - pytest
          - fastapi
          - uvicorn
          - types-requests
          - websockets

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef  # frozen: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: ce4bd7270237e95464b37d808b942f02785192c4  # frozen: v23.1.5
    hooks:
      - id: clang-format
        types_or: ['c', 'c++']

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 28010ddd6016e1a0f7bd232acb6536ef996ae897  # frozen: 0.29.2
    hooks:
    - id: gersemi

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: oxlint
        types_or: ['ts', 'javascript']
        language: node
        additional_dependencies:
          - oxlint
      - id: oxfmt
        name: oxfmt
        entry: oxfmt
        types_or: ['ts', 'javascript']
        language: node
        additional_dependencies:
          - oxfmt
  - repo: local
    hooks:
      - id: generate-stubs
        name: Check generated Python stubs are up-to-date
        entry: maturin generate-stubs --out bindings/python/zeek_websocket/
        language: python
        additional_dependencies:
          - "maturin==1.14.1"
        pass_filenames: false
        files: ^(src/|Cargo\.(toml|lock)|bindings/python/zeek_websocket/.*\.pyi$)
